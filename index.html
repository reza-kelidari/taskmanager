<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت وظایف روزانه</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="mode-pan" dir="rtl" lang="fa">
    <div class="tools">
      <button id="tool-pan" class="tool-btn active" title="جابجایی در محیط">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
          <path
            d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"
          ></path>
        </svg>
      </button>
      <button id="tool-move" class="tool-btn" title="ویرایش و اتصال">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
          <path d="M13 13l6 6"></path>
        </svg>
      </button>
      <div class="separator"></div>
      <button id="tool-arrange" class="tool-btn" title="چینش خودکار">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 4V2" />
          <path d="M15 16v-2" />
          <path d="M8 9h2" />
          <path d="M20 9h2" />
          <path d="M17.8 11.8 19 13" />
          <path d="M15 9h0" />
          <path d="M17.8 6.2 19 5" />
          <path d="m3 21 9-9" />
          <path d="M12.2 6.2 11 5" />
        </svg>
      </button>
    </div>

    <div id="canvas-wrapper">
      <div id="canvas" style="left: 0px; top: 0px">
        <svg id="connections-layer"></svg>
        <div id="empty-state">برای اولین سرفصل راست کلیک کنین</div>
      </div>
    </div>

    <div id="date-display">تاریخ شمسی</div>

    <div id="context-menu" class="context-menu hidden">
      <div class="menu-item" data-action="new-header">سرفصل جدید</div>
      <div class="menu-item" data-action="new-task">وظیفه جدید</div>
    </div>

    <div id="element-menu" class="context-menu hidden">
      <div class="menu-item" data-action="edit">ویرایش</div>
      <div class="menu-item" data-action="delete">حذف</div>
      <div class="menu-item" data-action="toggle-done">انجام شده</div>
      <div class="menu-item" data-action="comments">یادداشت‌ها</div>
    </div>

    <div id="notes-menu" class="context-menu hidden">
      <div class="notes-header">
        <div class="menu-item" id="back-from-notes" title="بازگشت">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
        <div
          class="menu-item"
          id="add-note-btn"
          style="flex: 1; text-align: right"
        >
          افزودن یادداشت
        </div>
      </div>
      <div id="notes-list"></div>
    </div>

    <div id="input-modal" class="hidden">
      <div class="modal-content">
        <input
          type="text"
          id="input-title"
          placeholder="عنوان (حداکثر ۲۵ کاراکتر)"
          maxlength="25"
        />
        <textarea
          id="input-note"
          placeholder="توضیحات"
          style="display: none"
        ></textarea>
        <button id="btn-save">ذخیره</button>
      </div>
    </div>

    <div id="note-modal" class="hidden">
      <div class="modal-content">
        <textarea id="note-text-input" placeholder="متن یادداشت"></textarea>
        <button id="save-note-btn">ذخیره یادداشت</button>
      </div>
    </div>

    <div id="confirm-modal" class="hidden">
      <div class="modal-content">
        <p
          id="confirm-text"
          style="text-align: center; font-size: 14px; margin: 10px 0"
        >
          آیا از حذف این یادداشت اطمینان دارید؟
        </p>
        <div style="display: flex; gap: 10px">
          <button
            id="confirm-yes"
            style="
              flex: 1;
              background: #dc3545;
              color: #fff;
              border: none;
              padding: 8px;
              border-radius: 10px;
              cursor: pointer;
            "
          >
            بله
          </button>
          <button
            id="confirm-no"
            style="
              flex: 1;
              background: #e8e8e8;
              color: #333;
              border: none;
              padding: 8px;
              border-radius: 10px;
              cursor: pointer;
            "
          >
            خیر
          </button>
        </div>
      </div>
    </div>

    <div id="hover-box" class="hidden"></div>
    <div id="group-tooltip" class="hidden"></div>

    <script src="app.js"></script>
  </body>
</html>

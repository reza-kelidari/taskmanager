<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="مدیریت وظایف روزانه با رابط کاربری بصری"
    />
    <title>مدیریت وظایف روزانه</title>
    <link rel="stylesheet" href="css/style.css" />

  </head>
  <body dir="rtl" lang="fa">
    <div class="tools" role="toolbar" aria-label="ابزارها">
      <button
        id="tool-arrange"
        class="tool-btn"
        title="چینش خودکار"
        aria-label="چینش خودکار"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 4V2" />
          <path d="M15 16v-2" />
          <path d="M8 9h2" />
          <path d="M20 9h2" />
          <path d="M17.8 11.8 19 13" />
          <path d="M15 9h0" />
          <path d="M17.8 6.2 19 5" />
          <path d="m3 21 9-9" />
          <path d="M12.2 6.2 11 5" />
        </svg>
      </button>
      <button
        id="tool-search"
        class="tool-btn"
        title="جستجو (Ctrl+F)"
        aria-label="جستجو"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </button>
      <div class="separator"></div>
      <button
        id="tool-redo"
        class="tool-btn"
        title="از نو (Ctrl+Y)"
        aria-label="از نو"
        disabled
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
        </svg>
      </button>
      <button
        id="tool-undo"
        class="tool-btn"
        title="بازگشت (Ctrl+Z)"
        aria-label="بازگشت"
        disabled
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>
      <div class="separator"></div>
      <button
        id="tool-more"
        class="tool-btn"
        title="امکانات بیشتر"
        aria-label="منوی امکانات"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="5" r="1"></circle>
          <circle cx="12" cy="19" r="1"></circle>
        </svg>
      </button>
    </div>

    <div
      id="more-menu"
      class="context-menu hidden"
      role="menu"
      aria-label="منوی امکانات"
    >
      <div
        class="menu-item"
        data-action="dark-mode"
        role="menuitem"
        tabindex="0"
      >
        <svg
          class="icon-moon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg
          class="icon-sun"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <span>حالت تاریک/روشن</span>
      </div>
      <div class="menu-item" data-action="export" role="menuitem" tabindex="0">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>خروجی (Ctrl+E)</span>
      </div>
      <div class="menu-item" data-action="import" role="menuitem" tabindex="0">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>ورود (Ctrl+I)</span>
      </div>
    </div>

    <input type="file" id="file-import" accept=".json" style="display: none" />

    <div id="canvas-wrapper">
      <div id="canvas" style="left: 0px; top: 0px">
        <svg id="connections-layer"></svg>
        <div id="empty-state">برای اولین سرفصل راست کلیک کنین</div>
      </div>
    </div>

    <div id="date-display" aria-live="polite">تاریخ شمسی</div>

    <div
      id="context-menu"
      class="context-menu hidden"
      role="menu"
      aria-label="منوی زمینه"
    >
      <div
        class="menu-item"
        data-action="new-header"
        role="menuitem"
        tabindex="0"
      >
        سرفصل جدید
      </div>
      <div
        class="menu-item"
        data-action="new-task"
        role="menuitem"
        tabindex="0"
      >
        وظیفه جدید
      </div>
    </div>

    <div
      id="element-menu"
      class="context-menu hidden"
      role="menu"
      aria-label="منوی عنصر"
    >
      <div class="menu-item" data-action="edit" role="menuitem" tabindex="0">
        ویرایش
      </div>
      <div class="menu-item" data-action="delete" role="menuitem" tabindex="0">
        حذف
      </div>
      <div
        class="menu-item"
        data-action="toggle-done"
        role="menuitem"
        tabindex="0"
      >
        انجام شده
      </div>
      <div
        class="menu-item"
        data-action="comments"
        role="menuitem"
        tabindex="0"
      >
        یادداشت‌ها
      </div>
    </div>

    <div
      id="notes-menu"
      class="context-menu hidden"
      role="dialog"
      aria-label="یادداشت‌ها"
    >
      <div class="notes-header">
        <div
          class="menu-item"
          id="back-from-notes"
          title="بازگشت"
          tabindex="0"
          role="button"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
        <div
          class="menu-item"
          id="add-note-btn"
          style="flex: 1; text-align: right"
          tabindex="0"
          role="button"
        >
          افزودن یادداشت
        </div>
      </div>
      <div id="notes-list"></div>
    </div>

    <div
      id="input-modal"
      class="hidden"
      role="dialog"
      aria-label="ورود اطلاعات"
    >
      <div class="modal-content">
        <input
          type="text"
          id="input-title"
          placeholder="عنوان (حداکثر ۲۵ کاراکتر)"
          maxlength="25"
          aria-label="عنوان"
        />
        <textarea
          id="input-note"
          placeholder="توضیحات"
          style="display: none"
          aria-label="توضیحات"
        ></textarea>
        <button id="btn-save">ذخیره</button>
      </div>
    </div>

    <div id="note-modal" class="hidden" role="dialog" aria-label="یادداشت">
      <div class="modal-content">
        <textarea
          id="note-text-input"
          placeholder="متن یادداشت"
          aria-label="متن یادداشت"
        ></textarea>
        <button id="save-note-btn">ذخیره یادداشت</button>
      </div>
    </div>

    <div id="confirm-modal" class="hidden" role="dialog" aria-label="تایید حذف">
      <div class="modal-content">
        <p
          id="confirm-text"
          style="text-align: center; font-size: 14px; margin: 10px 0"
        >
          آیا از حذف این یادداشت اطمینان دارید؟
        </p>
        <div style="display: flex; gap: 10px">
          <button
            id="confirm-yes"
            style="
              flex: 1;
              background: #dc3545;
              color: #fff;
              border: none;
              padding: 8px;
              border-radius: 10px;
              cursor: pointer;
            "
          >
            بله
          </button>
          <button
            id="confirm-no"
            style="
              flex: 1;
              background: #e8e8e8;
              color: #333;
              border: none;
              padding: 8px;
              border-radius: 10px;
              cursor: pointer;
            "
          >
            خیر
          </button>
        </div>
      </div>
    </div>

    <div id="search-modal" class="hidden" role="dialog" aria-label="جستجو">
      <div class="modal-content">
        <input
          type="text"
          id="search-input"
          placeholder="جستجو در همه‌جا"
          aria-label="جستجو"
        />
        <div id="search-results"></div>
      </div>
    </div>

    <div id="hover-box" class="hidden" role="tooltip"></div>

    <div
      id="toast-container"
      class="toast-container"
      role="alert"
      aria-live="polite"
    ></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
